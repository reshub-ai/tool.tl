<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Comparison of QR code, barcode, and dynamic QR code scenarios</title>
  <desc id="desc">Three-column comparison card for choosing between QR codes, barcodes, and dynamic QR codes.</desc>
  <defs>
    <linearGradient id="bg2" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fffef8"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#8098b5" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="112" y="136" font-size="56" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#15314d">Choose the right code for the right job</text>
  <text x="112" y="188" font-size="28" font-family="Segoe UI, Arial, sans-serif" fill="#546b84">A quick visual comparison for packaging, menus, campaigns, and operations.</text>
  <g transform="translate(104 250)" filter="url(#shadow2)">
    <rect width="430" height="530" rx="34" fill="#ffffff"/>
    <text x="38" y="62" font-size="36" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1d4f91">QR Code</text>
    <text x="38" y="102" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#5e738b">Best for URLs, Wi-Fi, vCards, and content.</text>
    <rect x="38" y="140" width="150" height="150" rx="16" fill="#eff6ff"/>
    <rect x="56" y="158" width="42" height="42" fill="#0f172a"/>
    <rect x="128" y="158" width="42" height="42" fill="#0f172a"/>
    <rect x="56" y="230" width="42" height="42" fill="#0f172a"/>
    <rect x="108" y="178" width="20" height="20" fill="#0f172a"/>
    <rect x="108" y="212" width="20" height="20" fill="#0f172a"/>
    <rect x="140" y="212" width="20" height="20" fill="#0f172a"/>
    <text x="38" y="344" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#16324f">Typical uses</text>
    <text x="38" y="388" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#4b6179">Open landing pages</text>
    <text x="38" y="426" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#4b6179">Share Wi-Fi instantly</text>
    <text x="38" y="464" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#4b6179">Deliver digital business cards</text>
    <text x="38" y="522" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#16324f">Watch out for</text>
    <text x="38" y="566" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#4b6179">Too much data makes the matrix dense</text>
    <text x="38" y="604" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#4b6179">Low contrast hurts scan reliability</text>
  </g>
  <g transform="translate(586 250)" filter="url(#shadow2)">
    <rect width="430" height="530" rx="34" fill="#ffffff"/>
    <text x="38" y="62" font-size="36" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#156449">Barcode</text>
    <text x="38" y="102" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#5e738b">Best for identifiers and scanner workflows.</text>
    <rect x="38" y="140" width="190" height="150" rx="16" fill="#eefbf5"/>
    <g transform="translate(56 156)" stroke="#0f172a" stroke-width="10" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="118"/>
      <line x1="24" y1="0" x2="24" y2="118"/>
      <line x1="50" y1="0" x2="50" y2="118"/>
      <line x1="78" y1="0" x2="78" y2="118"/>
      <line x1="92" y1="0" x2="92" y2="118"/>
      <line x1="126" y1="0" x2="126" y2="118"/>
      <line x1="150" y1="0" x2="150" y2="118"/>
    </g>
    <text x="38" y="344" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#16324f">Typical uses</text>
    <text x="38" y="388" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#4b6179">Retail checkout</text>
    <text x="38" y="426" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#4b6179">Warehouse picking and inventory</text>
    <text x="38" y="464" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#4b6179">Asset labels and lot numbers</text>
    <text x="38" y="522" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#16324f">Watch out for</text>
    <text x="38" y="566" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#4b6179">Format must match downstream scanners</text>
    <text x="38" y="604" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#4b6179">Wrong standard leads to failed reads</text>
  </g>
  <g transform="translate(1068 250)" filter="url(#shadow2)">
    <rect width="430" height="530" rx="34" fill="#ffffff"/>
    <text x="38" y="62" font-size="36" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#a05a00">Dynamic QR</text>
    <text x="38" y="102" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#5e738b">Best when printed assets outlive the first URL.</text>
    <g transform="translate(38 146)">
      <rect width="130" height="130" rx="16" fill="#fff6e7"/>
      <rect x="16" y="16" width="32" height="32" fill="#0f172a"/>
      <rect x="82" y="16" width="32" height="32" fill="#0f172a"/>
      <rect x="16" y="82" width="32" height="32" fill="#0f172a"/>
      <rect x="58" y="58" width="16" height="16" fill="#0f172a"/>
      <path d="M154 64h82" stroke="#d97706" stroke-width="8" stroke-linecap="round"/>
      <path d="M228 50l22 14-22 14" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="264" y="18" width="108" height="92" rx="18" fill="#fff6e7" stroke="#f2cf91" stroke-width="3"/>
      <text x="282" y="56" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#8a4b00">URL A</text>
      <text x="282" y="86" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#6e5a42">Change later</text>
    </g>
    <text x="38" y="344" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#16324f">Typical uses</text>
    <text x="38" y="388" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#4b6179">Long-lived posters and menus</text>
    <text x="38" y="426" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#4b6179">Campaigns that evolve over time</text>
    <text x="38" y="464" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#4b6179">Reusable print with changing destinations</text>
    <text x="38" y="522" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#16324f">Watch out for</text>
    <text x="38" y="566" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#4b6179">Redirect service must stay reliable</text>
    <text x="38" y="604" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#4b6179">Avoid slow or privacy-heavy routing chains</text>
  </g>
</svg>
